# home_assistant/nas_shutdown_package.yaml
#
# Home Assistant Package: NAS UPS Shutdown
# =========================================
# Monitors the Unifi UPS via NUT and shuts down the Synology NAS gracefully
# when battery drops to ≤50% while on battery power.
#
# HOW TO INSTALL
# --------------
# 1. Enable packages in your configuration.yaml (if not already done):
#
#      homeassistant:
#        packages: !include_dir_named packages
#
# 2. Create the directory:
#      mkdir -p /config/packages
#
# 3. Copy this file there:
#      cp home_assistant/nas_shutdown_package.yaml /config/packages/nas_shutdown_package.yaml
#
# 4. Copy the SSH private key to HA:
#      mkdir -p /config/.ssh
#      cp id_ed25519_ha_nas_shutdown /config/.ssh/
#      chmod 600 /config/.ssh/id_ed25519_ha_nas_shutdown
#
# 5. Reload HA: Settings → System → Restart (or restart the HA service)
#
# 6. Verify sensors appear: Developer Tools → States → search "ups"
#
# NOTE: The NUT integration must be configured via the Home Assistant UI —
# it no longer supports YAML configuration. Add it at:
#   Settings → Integrations → Add Integration → NUT
#   Host: 10.20.30.5  Port: 3493
# This creates sensors:
#   sensor.network_ups_battery_charge  (0–100, integer percent)
#   sensor.network_ups_status          ("OL" = on-line, "OB" = on-battery, "LB" = low-battery)

# ─── Shell Command ───────────────────────────────────────────────────────────
# Issues the graceful halt to the NAS via SSH key authentication.
# The key was generated by nas_setup/generate_ssh_keypair.sh.
shell_command:
  shutdown_nas: >-
    ssh
    -i /config/.ssh/id_ed25519_ha_nas_shutdown
    -o StrictHostKeyChecking=no
    -o ConnectTimeout=10
    -o BatchMode=yes
    ha_shutdown@192.168.50.20
    'touch ~/.shutdown_requested'
    2>&1

  # Run via Developer Tools → Automations → "UPS: Generate NAS SSH key"
  # Generates the ED25519 keypair if it doesn't already exist, then
  # displays the public key in a persistent notification for copy-paste.
  generate_nas_ssh_key: >-
    bash -c '
    KEY=/config/.ssh/id_ed25519_ha_nas_shutdown;
    mkdir -p /config/.ssh;
    chmod 700 /config/.ssh;
    if [ ! -f "$KEY" ]; then
      ssh-keygen -t ed25519 -f "$KEY" -N "" -C "home-assistant-nas-shutdown" 2>&1;
      chmod 600 "$KEY";
    fi;
    ssh-keygen -y -f "$KEY" 2>&1;
    '

  # Run this via Developer Tools → Services to diagnose SSH connectivity
  # without triggering an actual shutdown.
  diagnose_nas_ssh: >-
    bash -c '
    KEY=/config/.ssh/id_ed25519_ha_nas_shutdown;
    NAS=192.168.50.20;
    echo "=== key file ===";
    ls -la $KEY 2>&1 || echo "KEY MISSING";
    echo "=== ping ===";
    ping -c2 -W2 $NAS 2>&1 | tail -3;
    echo "=== ssh port ===";
    nc -zw3 $NAS 22 2>&1 && echo "port 22 OPEN" || echo "port 22 CLOSED/unreachable";
    echo "=== ssh auth ===";
    ssh -i $KEY -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes
    -o PasswordAuthentication=no ha_shutdown@$NAS echo "SSH_OK" 2>&1;
    '

# ─── Guard Flag ──────────────────────────────────────────────────────────────
# Prevents the automation from firing repeatedly if battery oscillates near 50%,
# or if the NAS takes time to shut down and the sensor keeps reading low.
# Reset automatically when AC power is restored.
input_boolean:
  nas_shutdown_triggered:
    name: NAS UPS Shutdown Triggered
    icon: mdi:power
    initial: false

# ─── Automations ─────────────────────────────────────────────────────────────
automation:
  # PRIMARY: Trigger graceful NAS shutdown at ≤50% battery on battery power
  - id: ups_shutdown_nas_at_50_percent
    alias: "UPS: Shutdown NAS at 50% battery"
    description: >
      When the UPS is on battery (OB) and charge drops to 50% or below,
      wait 30 seconds then SSH-shutdown the Synology NAS.
    trigger:
      - platform: numeric_state
        entity_id: sensor.network_ups_battery_charge
        # Fires when battery crosses below 51 (i.e., first reading at ≤50)
        below: 51
    action:
      # Set guard flag immediately to block any re-triggers
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.nas_shutdown_triggered

      # Notify so there's a visible record in HA
      - service: persistent_notification.create
        data:
          title: "UPS Alert — NAS Shutdown Pending"
          message: >
            UPS battery at {{ states('sensor.network_ups_battery_charge') }}% on battery power.
            Shutting down NAS (192.168.50.20) now.
          notification_id: ups_nas_shutdown

      # Send the shutdown command and capture result
      - service: shell_command.shutdown_nas
        response_variable: ssh_result

      # Notify based on whether SSH succeeded or failed
      - if:
          - condition: template
            value_template: "{{ ssh_result.returncode == 0 }}"
        then:
          - service: persistent_notification.create
            data:
              title: "UPS Alert — NAS Shutdown Sent"
              message: >
                Shutdown command sent to NAS at
                {{ now().strftime('%H:%M:%S') }}.
                UPS battery: {{ states('sensor.network_ups_battery_charge') }}%.
              notification_id: ups_nas_shutdown
        else:
          - service: persistent_notification.create
            data:
              title: "UPS Alert — NAS Shutdown FAILED"
              message: >
                SSH shutdown command FAILED (exit code {{ ssh_result.returncode }}).
                Error: {{ ssh_result.stdout | default('(no output)') }}
                NAS may NOT be shutting down. Check HA logs and verify:
                • Key exists at /config/.ssh/id_ed25519_ha_nas_shutdown (chmod 600)
                • NAS reachable at 192.168.50.20
                • ha_shutdown user configured on NAS
              notification_id: ups_nas_shutdown

  # DIAGNOSTIC: Run manually via Developer Tools → Automations to check SSH prerequisites
  - id: ups_diagnose_nas_ssh
    alias: "UPS: Diagnose NAS SSH connection"
    description: >
      Manual trigger only. Checks key file, ping, port 22, and SSH auth
      then shows all results in a persistent notification. Safe — no shutdown.
    trigger: []
    action:
      - service: shell_command.diagnose_nas_ssh
        response_variable: diag
      - service: persistent_notification.create
        data:
          title: "NAS SSH Diagnostics"
          message: "{{ diag.stdout | default('(no output — shell_command may not support this HA version)') }}"
          notification_id: nas_ssh_diag

  # SETUP: Generate SSH keypair from HA UI — run once during initial setup
  - id: ups_generate_nas_ssh_key
    alias: "UPS: Generate NAS SSH key"
    description: >
      Manual trigger only. Generates the ED25519 keypair at
      /config/.ssh/id_ed25519_ha_nas_shutdown if it doesn't exist,
      then shows the public key in a notification so it can be
      copied to the NAS authorized_keys.
    trigger: []
    action:
      - service: shell_command.generate_nas_ssh_key
        response_variable: keygen_result
      - service: persistent_notification.create
        data:
          title: "NAS SSH Key"
          message: >
            {{ keygen_result.stdout | default('(no output)') }}

            Next: copy the public key above into
            ~ha_shutdown/.ssh/authorized_keys on the NAS,
            then run the "UPS: Diagnose NAS SSH connection" automation to verify.
          notification_id: nas_ssh_keygen

  # RESET: Clear guard flag when AC power is restored so next outage works
  - id: ups_reset_nas_shutdown_flag
    alias: "UPS: Reset NAS shutdown flag on power restore"
    description: >
      Clears the guard flag when the UPS goes back online so the next
      power outage will trigger the shutdown automation again.
      Also fires on HA startup so a stuck flag from a previous reboot is
      always cleared when AC power is present.
    trigger:
      # Template trigger: fires when status contains "OL" but not "OB".
      # Handles compound strings like "OL CHRG" that an exact to: "OL" would miss.
      - platform: template
        value_template: >-
          {{ 'OL' in states('sensor.network_ups_status') and
             'OB' not in states('sensor.network_ups_status') }}
      - platform: homeassistant
        event: start  # HA restarted — always clear any flag left from last session
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.nas_shutdown_triggered

      - service: persistent_notification.dismiss
        data:
          notification_id: ups_nas_shutdown
